name: Validate PWA
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/full-pwa-ux-upgrade]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check sw.js
          node --check enhancements.js
          node --check pwa-update.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall('<script(?![^>]*src=)[^>]*>(.*?)</script>', html, re.I | re.S)
          if not scripts:
              raise SystemExit("No inline JavaScript found")
          for i, script in enumerate(scripts):
              Path(f"/tmp/inline-{i}.js").write_text(script, encoding="utf-8")
          print(f"Extracted {len(scripts)} inline script(s)")
          PY
          for file in /tmp/inline-*.js; do node --check "$file"; done
      - name: Validate manifest JSON and installability icons
        run: |
          python3 - <<'PY'
          import json
          import struct
          from pathlib import Path

          manifest = json.loads(Path("manifest.json").read_text(encoding="utf-8"))
          assert manifest.get("id") == "./?app=admh-direct-whatsapp-v2"
          assert manifest.get("start_url") == "./?source=pwa-v2"
          icons = manifest.get("icons", [])
          required = {192: "icon-192.png", 512: "icon-512.png"}
          for size, filename in required.items():
              matches = [i for i in icons if i.get("src") == f"./{filename}" and
                         i.get("type") == "image/png" and i.get("sizes") == f"{size}x{size}"]
              assert matches, f"Manifest is missing {size}x{size} PNG icon entry"
              data = Path(filename).read_bytes()
              assert data[:8] == bytes([137, 80, 78, 71, 13, 10, 26, 10]), f"{filename} is not a PNG"
              width, height = struct.unpack(">II", data[16:24])
              assert (width, height) == (size, size), f"{filename} has dimensions {width}x{height}"
              assert len(data) > 100, f"{filename} appears empty or corrupted"
              print(f"Validated {filename}: {width}x{height}, {len(data)} bytes")
          svg = [i for i in icons if i.get("src") == "./icon.svg"]
          assert svg, "SVG fallback icon is missing"
          PY
      - name: Verify local PWA assets
        run: |
          test -f index.html
          test -f sw.js
          test -f manifest.json
          test -f icon.svg
          test -f icon-192.png
          test -f icon-512.png
          test -f vendor/qrcode.min.js
          test -f enhancements.js
          test -f pwa-update.js
          grep -q 'enhancements.js' index.html
          grep -q 'pwa-update.js' index.html
          grep -q 'admh-direct-whatsapp-v6' sw.js
          grep -q 'icon-192.png' index.html
