  .brand span { display:block; font-size:10px; color:var(--muted); }

  .langs button { border:0; background:transparent; color:var(--muted); font:inherit; font-size:11px; padding:7px 10px; border-radius:9px; cursor:pointer; }

  .card .icon { width:34px; height:34px; border-radius:11px; display:grid; place-items:center; background:rgba(110,231,183,.12); color:var(--accent); font-size:17px; margin-bottom:9px; }
  .card h3 { margin:0 0 4px; font-size:14px; }

const params = new URLSearchParams(location.search);
const initial = LANGS.includes(params.get('lang')) ? params.get('lang') : 'ar';
const listKeys = { web: 'web', android: 'android', privacy: 'privacy' };

function render(lang) {
  const c = CONTENT[lang];
  const html = document.documentElement;
  html.lang = lang;
  html.dir = lang === 'en' ? 'ltr' : 'rtl';
  html.dataset.lang = lang;
  document.title = c.title;
  document.querySelectorAll('[data-i18n]').forEach((node) => {
    const key = node.getAttribute('data-i18n');
    node.textContent = c[key] || '';
  });
  document.querySelectorAll('[data-list]').forEach((node) => {
    const key = node.getAttribute('data-list');
    node.innerHTML = (c[key] || []).map((item) => `<li>${item}</li>`).join('');
  });
  document.querySelectorAll('[data-set-lang]').forEach((button) => {
    button.setAttribute('aria-pressed', String(button.getAttribute('data-set-lang') === lang));
  });
}
render(initial);
document.querySelectorAll('[data-set-lang]').forEach((button) => {
  button.addEventListener('click', () => {
    const lang = button.getAttribute('data-set-lang');
    const url = new URL(location.href);
    url.searchParams.set('lang', lang);
    history.replaceState(null, '', url);
    render(lang);
  });
});
